[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[dev]
  command = "npm run dev"
  targetPort = 4321
  framework = "#custom"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/pricing.html"
  to = "/pricing"
  status = 301

[[redirects]]
  from = "/privacy.html"
  to = "/privacy"
  status = 301

[[redirects]]
  from = "/terms.html"
  to = "/terms"
  status = 301

[[redirects]]
  from = "/refund-policy.html"
  to = "/refunds"
  status = 301

[[redirects]]
  from = "/billing.html"
  to = "/billing"
  status = 301

[[redirects]]
  from = "/marketplace-disclosure.html"
  to = "/marketplace"
  status = 301

[[redirects]]
  from = "/security.html"
  to = "/security"
  status = 301

[[redirects]]
  from = "/support.html"
  to = "/support"
  status = 301
